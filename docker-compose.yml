# CQUPT 安全组考核靶场 - Docker Compose

x-app-defaults: &app-defaults
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - cqupt-network
  deploy:
    resources:
      limits:
        memory: 256m
        cpus: "0.35"
      reservations:
        memory: 64m
  environment: &app-env
    NODE_ENV: production
    PORT: "3000"
    REDIS_URL: "redis://:${REDIS_PASSWORD:-redis123}@redis:6379"
    JWT_SECRET: "${JWT_SECRET}"
    SMTP_HOST: "${SMTP_HOST:-}"
    SMTP_PORT: "${SMTP_PORT:-587}"
    SMTP_SECURE: "${SMTP_SECURE:-false}"
    SMTP_USER: "${SMTP_USER:-}"
    SMTP_PASS: "${SMTP_PASS:-}"
    SMTP_FROM: "${SMTP_FROM:-}"
    GEMINI_API_KEY: "${GEMINI_API_KEY:-}"

services:
  postgres:
    image: postgres:16-alpine
    container_name: cqupt-range-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres123}"
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cqupt-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cqupt-range-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: "redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes"
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cqupt-network
    restart: unless-stopped

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    container_name: cqupt-range-portal
    environment:
      MAX_SLOTS: "10"
      SESSION_TIMEOUT_MIN: "120"
      HEARTBEAT_TIMEOUT_SEC: "300"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres123}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cqupt-network
    restart: unless-stopped

  app-1:
    <<: *app-defaults
    container_name: cqupt-app-1
    environment:
      <<: *app-env
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/cqupt_slot_1"

  app-2:
    <<: *app-defaults
    container_name: cqupt-app-2
    environment:
      <<: *app-env
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/cqupt_slot_2"

  app-3:
    <<: *app-defaults
    container_name: cqupt-app-3
    environment:
      <<: *app-env
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/cqupt_slot_3"

  app-4:
    <<: *app-defaults
    container_name: cqupt-app-4
    environment:
      <<: *app-env
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/cqupt_slot_4"

  app-5:
    <<: *app-defaults
    container_name: cqupt-app-5
    environment:
      <<: *app-env
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/cqupt_slot_5"

  app-6:
    <<: *app-defaults
    container_name: cqupt-app-6
    environment:
      <<: *app-env
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/cqupt_slot_6"

  app-7:
    <<: *app-defaults
    container_name: cqupt-app-7
    environment:
      <<: *app-env
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/cqupt_slot_7"

  app-8:
    <<: *app-defaults
    container_name: cqupt-app-8
    environment:
      <<: *app-env
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/cqupt_slot_8"

  app-9:
    <<: *app-defaults
    container_name: cqupt-app-9
    environment:
      <<: *app-env
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/cqupt_slot_9"

  app-10:
    <<: *app-defaults
    container_name: cqupt-app-10
    environment:
      <<: *app-env
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/cqupt_slot_10"

  nginx:
    image: nginx:alpine
    container_name: cqupt-range-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - portal
    networks:
      - cqupt-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: cqupt-range-certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - cqupt-network
    restart: unless-stopped

networks:
  cqupt-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  letsencrypt:
    driver: local
  certbot_webroot:
    driver: local
