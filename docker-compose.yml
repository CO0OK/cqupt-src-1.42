version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: cqupt-src-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-cqupt_src}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 初始化 SQL 脚本（如需要）
      # - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cqupt-network
    restart: unless-stopped

  # Redis 缓存（可选，用于邮箱验证码和会话）
  redis:
    image: redis:7-alpine
    container_name: cqupt-src-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cqupt-network
    restart: unless-stopped

  # 应用程序
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cqupt-src-app
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@postgres:5432/${DB_NAME:-cqupt_src}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 挂载 .env 文件以方便调试（可选）
      - ./.env:/app/.env:ro
    networks:
      - cqupt-network
    restart: unless-stopped
    # 若使用 nginx 反向代理，可注释掉此行
    # command: sh -c "npx prisma migrate deploy && node dist/server.js"

  # Nginx 反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: cqupt-src-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL 证书（如使用 HTTPS）
      # - ./certs/:/etc/nginx/certs/:ro
    depends_on:
      - app
    networks:
      - cqupt-network
    restart: unless-stopped
    # 仅当 nginx.conf 存在时才启用

networks:
  cqupt-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
